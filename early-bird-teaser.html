    :root {
      color-scheme: light dark;
      --bone: #F4F3F1;
      --paper: #FFFFFF;
      --ink: #17181A;
      --muted: #696B6E;
      --blue: #009ADE;
      --blue-dark: #007EB7;
      --rule: rgba(23, 24, 26, .16);
      --soft-blue: rgba(0, 154, 222, .11);
      --shadow: 0 24px 80px rgba(0, 0, 0, .25);
      --display: "BN Hamburg", "Arial Narrow", Arial, sans-serif;
      --body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
      --accent: Struko, "Arial Black", Impact, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bone: #111517;
        --paper: #1A2023;
        --ink: #F4F3F1;
        --muted: #B6B8BA;
        --blue: #18A9E8;
        --blue-dark: #57C4EF;
        --rule: rgba(244, 243, 241, .18);
        --soft-blue: rgba(24, 169, 232, .14);
        --shadow: 0 22px 70px rgba(0, 0, 0, .38);
      }
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background: var(--bone);
      color: var(--ink);
      font-family: var(--body);
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; }

    .page {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(28px, env(safe-area-inset-top)) 22px max(30px, env(safe-area-inset-bottom));
      isolation: isolate;
    }
    .intro {
      width: min(100%, 520px);
      text-align: center;
      transition: opacity .35s ease, transform .35s ease;
    }
    .intro.is-released { opacity: .18; transform: scale(.97); pointer-events: none; }
    h1 {
      font-family: Struko, cursive;
      text-transform: uppercase;
      max-width: 470px;
      margin: 0 auto;
      font-size: clamp(38px, 10.2vw, 65px);
      line-height: 1.05;
      letter-spacing: 0;
      font-weight: 400;
    }
    .sub {
      margin: 18px auto 31px;
      font-size: clamp(16px, 4.2vw, 19px);
      line-height: 1.5;
      color: var(--muted);
    }

    .hold-wrap {
      position: relative;
      width: min(100%, 430px);
      margin: 0 auto;
    }

    .hold-box {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 32px 24px 26px;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: #009ADE;
      color: #FFFFFF;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: transform .15s ease;
    }
    .hold-box:focus-visible { outline: 4px solid rgba(0, 154, 222, .24); outline-offset: 5px; }
    .hold-box.is-holding { transform: translateY(2px); }
    .hold-wrap.open .hold-box { transform: translateY(4px); }
    .progress {
      position: absolute;
      inset: 0;
      width: 0%;
      background: rgba(255, 255, 255, .16);
      transition: width .08s linear;
      pointer-events: none;
    }
    .hold-box.is-holding .progress { opacity: 1; }
    .hold-content { position: relative; z-index: 1; }
    .hold-label {
      font-family: var(--display);
      display: block;
      font-size: clamp(34px, 9vw, 52px);
      line-height: .95;
      font-weight: 800;
      letter-spacing: -.035em;
      text-transform: uppercase;
      color: #FFFFFF;
      transition: color .18s ease;
    }
    .hold-hint {
      display: block;
      margin-top: 10px;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: .01em;
      color: rgba(255, 255, 255, .9);
      transition: color .18s ease;
    }
    .hold-box.is-holding .hold-label,
    .hold-box.is-holding .hold-hint { color: white; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .bird {
      position: fixed;
      z-index: 20;
      left: 50%;
      top: 53%;
      width: 104px;
      height: 76px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.25) rotate(-9deg);
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.15));
    }
    .bird.fly { animation: bird-flight 1.35s cubic-bezier(.17,.65,.23,1) forwards; }
    .bird .wing { transform-box: fill-box; transform-origin: 85% 85%; }
    .bird.fly .wing { animation: flap .17s ease-in-out 7 alternate; }
    .bird .wing-back { transform-origin: 30% 90%; animation-delay: .07s; }
    @keyframes bird-flight {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.22) rotate(-11deg); }
      9% { opacity: 1; }
      42% { opacity: 1; transform: translate(-8vw, -17vh) scale(.85) rotate(5deg); }
      78% { opacity: 1; transform: translate(38vw, -42vh) scale(1.02) rotate(-4deg); }
      100% { opacity: 0; transform: translate(63vw, -55vh) scale(.6) rotate(9deg); }
    }
    @keyframes flap {
      from { transform: rotate(11deg) scaleY(.88); }
      to { transform: rotate(-28deg) scaleY(.46); }
    }

    .reveal {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(23, 24, 26, .44);
      opacity: 0;
      visibility: hidden;
      transition: opacity .28s ease, visibility .28s;
    }
    .reveal.show { opacity: 1; visibility: visible; }
    .card {
      position: relative;
      width: min(100%, 470px);
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: clamp(16px, 1.5vw, 29px);
      box-shadow: var(--shadow);
      transform: translateY(24px) scale(.98);
      transition: transform .38s cubic-bezier(.16,.8,.22,1);
    }
    .reveal.show .card { transform: none; }
    .card-body { padding: 30px 28px 26px; text-align: center; }
    .brand-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 0 auto 24px;
      color: var(--ink);
    }
    .brand-mark { width: 66px; height: auto; flex: 0 0 auto; }
    .brand-word {
      font-family: var(--display);
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.035em;
    }
    .card h2 {
      font-family: var(--display);
      font-weight: 700;
      margin: 0;
      font-size: clamp(32px, 9vw, 52px);
      line-height: .98;
      letter-spacing: -.045em;
    }
    .card p {
      margin: 16px 0 25px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }
    .ticket {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      height: 46px;
      padding: 0 25px;
      border-radius: 10px;
      background: var(--blue);
      border: 1px solid var(--blue);
      color: var(--ink);
      text-decoration: none;
      font-family: var(--body);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -.028em;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .ticket:hover { background: var(--blue-dark); border-color: var(--blue-dark); color: #fff; }
    .ticket:active { transform: translateY(2px); }
    .ticket:focus-visible { outline: 4px solid var(--soft-blue); outline-offset: 4px; }
    .ticket svg { width: 22px; flex: 0 0 auto; }
    .again {
      display: block;
      margin: 17px auto 0;
      padding: 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    @media (min-width: 720px) {
      .page { padding: 42px; }
      .hold-box { min-height: 210px; }
    }
    @media (max-height: 680px) {
      .page { padding-top: 22px; padding-bottom: 20px; }
      h1 { font-size: clamp(34px, 8.8vh, 50px); }
      .sub { margin: 12px 0 20px; }
      .hold-box { min-height: 154px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .bird.fly { opacity: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="intro" id="intro" aria-labelledby="headline">
      <h1 id="headline">THANK YOU FOR SCANNING.</h1>
      <p class="sub">Ready to let it fly?</p>

      <div class="hold-wrap" id="holdWrap">
        <button class="hold-box" id="holdBox" type="button" aria-describedby="holdStatus">
          <span class="progress" id="progress" aria-hidden="true"></span>
          <span class="hold-content">
            <span class="hold-label">Press and hold</span>
            <span class="hold-hint">to release the bird</span>
          </span>
        </button>
      </div>
      <p class="sr-only" id="holdStatus" aria-live="polite"></p>
    </section>

    <svg class="bird" id="bird" viewBox="0 0 130 94" role="img" aria-label="A blue bird flies away">
      <g fill="none" stroke="#17181A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
        <path class="wing wing-back" fill="#008CCB" d="M57 54C38 54 23 44 13 24c24 2 40 9 50 23Z"/>
        <path fill="#009ADE" d="M48 57c9-22 30-30 48-20 8 4 12 12 12 21 0 17-17 27-37 22-15-4-26-12-23-23Z"/>
        <path class="wing" fill="#31B5EC" d="M67 54C63 31 69 14 88 5c7 23 3 40-12 53Z"/>
        <path fill="#F4F3F1" d="M106 48l18 7-17 9Z"/>
        <circle cx="96" cy="43" r="2.5" fill="#17181A" stroke="none"/>
        <path d="M50 66 33 74l15 5"/>
      </g>
    </svg>

    <section class="reveal" id="reveal" aria-hidden="true" aria-labelledby="revealTitle">
      <div class="card">
        <div class="card-body">
          <div class="brand-lockup" aria-label="Antwerk">
            <svg class="brand-mark" viewBox="0 0 165.53 126.66" role="img" aria-label="Antwerk logo mark">
              <path fill="#00b9f2" d="M81.98,118.5c4.89,4.89,11.3,7.33,17.72,7.33,6.42,0,12.84-2.44,17.72-7.33.93-.93,2.29-2.48,3.28-4.04,5.71-8.99,16.07-28.36,40.52-75.25,2.22-4.26,3.05-8.58,3.05-12.25,0-14.83-12.12-26.13-26.13-26.13-8.4,0-18.6,4.21-23.93,15.63-3.61,7.74-9.86,21.52-14.54,32.22,0,0-6.75-12.58-9.22-16.64-4.21-6.92-11.79-10.84-19.33-10.84-8.69,0-17.12,5.05-20.92,13.95-2.91,6.82-11.04,27.52-11.04,27.52,0,0-5.97-8.29-8.96-12.38-3.18-4.35-8.02-6.64-12.97-6.64-5.25,0-10.12,2.59-13.1,6.82-2.77,3.93-4.16,9.6-1.43,15.86,9.3,21.35,18.01,38.92,23.92,48.99,1.29,2.2,2.53,3.58,3.37,4.43,4.05,4.05,9.38,6.08,14.71,6.08,5.33,0,10.65-2.03,14.71-6.08,6.18-6.18,11.51-21.7,11.51-21.7,0,0,4.55,13.95,11.06,20.46Z"/>
              <circle fill="#7ed3f7" cx="99.71" cy="100.78" r="16.85"/>
              <circle fill="#7ed3f7" cx="71.14" cy="43.86" r="14.4"/>
              <circle fill="#7ed3f7" cx="44.71" cy="105.04" r="12.5"/>
            </svg>
            <span class="brand-word">ANTWERK</span>
          </div>
          <h2 id="revealTitle">YOUR EARLY BIRD IS HERE.</h2>
          <p>Early bird registration is now open with a special discount for you.</p>
          <a class="ticket" href="https://antwerk.zohobackstage.eu/ANTWERK2026" target="_blank" rel="noopener noreferrer">
            <span>Get your early bird ticket</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>
          </a>
          <button class="again" id="again" type="button">Do that again</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var HOLD_MS = 1500;
      var holdBox = document.getElementById('holdBox');
      var progress = document.getElementById('progress');
      var status = document.getElementById('holdStatus');
      var wrap = document.getElementById('holdWrap');
      var intro = document.getElementById('intro');
      var bird = document.getElementById('bird');
      var reveal = document.getElementById('reveal');
      var again = document.getElementById('again');
      var startTime = 0;
      var frame = 0;
      var holding = false;
      var released = false;

      function setProgress(value) {
        progress.style.width = Math.max(0, Math.min(100, value)) + '%';
      }

      function tick(now) {
        if (!holding || released) return;
        var ratio = (now - startTime) / HOLD_MS;
        setProgress(ratio * 100);
        if (ratio >= 1) {
          complete();
          return;
        }
        frame = requestAnimationFrame(tick);
      }

      function begin(event) {
        if (released || holding) return;
        if (event.type === 'pointerdown' && event.button !== 0) return;
        event.preventDefault();
        holding = true;
        holdBox.classList.add('is-holding');
        status.textContent = 'Keep holding…';
        startTime = performance.now();
        frame = requestAnimationFrame(tick);
        if (event.pointerId !== undefined) {
          try { holdBox.setPointerCapture(event.pointerId); } catch (ignore) {}
        }
      }

      function cancel() {
        if (!holding || released) return;
        holding = false;
        cancelAnimationFrame(frame);
        holdBox.classList.remove('is-holding');
        setProgress(0);
        status.textContent = 'Too quick. The bird is not impressed.';
      }

      function complete() {
        holding = false;
        released = true;
        cancelAnimationFrame(frame);
        setProgress(100);
        holdBox.classList.remove('is-holding');
        holdBox.disabled = true;
        wrap.classList.add('open');
        intro.classList.add('is-released');
        status.textContent = 'There it goes.';
        bird.classList.add('fly');
        window.setTimeout(function () {
          reveal.classList.add('show');
          reveal.setAttribute('aria-hidden', 'false');
          window.setTimeout(function () {
            var ticket = reveal.querySelector('.ticket');
            if (ticket) ticket.focus();
          }, 120);
        }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 80 : 980);
      }

      function reset() {
        reveal.classList.remove('show');
        reveal.setAttribute('aria-hidden', 'true');
        intro.classList.remove('is-released');
        wrap.classList.remove('open');
        bird.classList.remove('fly');
        holdBox.disabled = false;
        released = false;
        holding = false;
        setProgress(0);
        status.textContent = '';
        holdBox.focus();
      }

      holdBox.addEventListener('pointerdown', begin);
      holdBox.addEventListener('pointerup', cancel);
      holdBox.addEventListener('pointercancel', cancel);
      holdBox.addEventListener('lostpointercapture', cancel);
      holdBox.addEventListener('contextmenu', function (event) { event.preventDefault(); });
      holdBox.addEventListener('dragstart', function (event) { event.preventDefault(); });
      holdBox.addEventListener('keydown', function (event) {
        if ((event.key === ' ' || event.key === 'Enter') && !event.repeat) begin(event);
      });
      holdBox.addEventListener('keyup', function (event) {
        if (event.key === ' ' || event.key === 'Enter') cancel();
      });
      again.addEventListener('click', reset);
    })();
  </script>
</body>
</html>
